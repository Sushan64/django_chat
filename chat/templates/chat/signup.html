{% extends 'chat/base.html' %}
{% block title %}
Signup
{% endblock %}
{% block content %}
<div class="max-w-md mx-auto p-8 bg-teal-600 rounded-xl shadow-md">
  <h2 class="text-2xl font-bold text-white mb-6">Create an Account</h2>
  
  <form method="POST" class="space-y-5">
    {%  csrf_token %}
    <!-- Username Field -->
    <div class="flex flex-col gap-1.5">
      <label for="username" class="text-sm font-semibold text-gray-100">Username</label>
      <input 
        type="text" 
        id="username" 
        name="username" 
        placeholder="Choose a username" 
        required 
        class="w-full bg-white px-4 py-2.5 text-base border border-gray-300 rounded-lg outline-none transition duration-200"
      />
    </div>
    
    <!-- Password Field -->
    <div class="flex flex-col gap-1.5">
      <label for="password" class="text-sm font-semibold text-gray-100">Password</label>
      <input 
        type="password" 
        id="password1" 
        name="password1" 
        placeholder="Create a password" 
        required 
        class="w-full px-4 bg-white py-2.5 text-base border border-gray-300 rounded-lg outline-none transition duration-200"
      />
    </div>
    
    <!-- Confirm Password Field -->
    <div class="flex flex-col gap-1.5">
      <label for="confirm-password" class="text-sm font-semibold text-gray-100">Confirm Password</label>
      <input 
        type="password" 
        id="password2" 
        name="password2" 
        placeholder="Repeat your password" 
        required 
        class="w-full px-4 bg-white py-2.5 text-base border border-gray-300 rounded-lg outline-none transition duration-200"
      />
    </div>
    
    {% for error in form.non_field_errors %}
    <p>{{ error }}</p>
    {% endfor %}
    <!-- Submit Button -->
    <button 
      type="submit" 
      class="w-full mt-2 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-sm transition duration-200 active:scale-[0.99]"
    >
      Sign Up
    </button>
  </form>
</div>

{% endblock %}
